name: Build Kernel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5

    - name: Download and Setup Zyc-Clang Toolchain
      run: |
        mkdir -p $HOME/zyc-clang
        git clone https://github.com/ZyCromerZ/Clang.git -b 14 $HOME/zyc-clang --depth=1

    - name: Overwrite and Create build_kernel.sh
      run: |
        cat << 'EOF' > build_kernel.sh
        #!/bin/bash

        export TC=$HOME/zyc-clang

        export CROSS_COMPILE=$TC/bin/aarch64-linux-gnu-
        export LD=$TC/bin/ld.lld
        export OBJCOPY=$TC/bin/llvm-objcopy
        export AS=$TC/bin/llvm-as
        export NM=$TC/bin/llvm-nm
        export STRIP=$TC/bin/llvm-strip
        export OBJDUMP=$TC/bin/llvm-objdump
        export READELF=$TC/bin/llvm-readelf
        export CC=$TC/bin/clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export ARCH=arm64

        export KCFLAGS=-w
        export CONFIG_SECTION_MISMATCH_WARN_ONLY=y

        make -C $(pwd) O=$(pwd)/out KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y clean && make -C $(pwd) O=$(pwd)/out KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y mrproper
        clear

        make -s -C $(pwd) O=$(pwd)/out KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y vendor/a23_eur_open_defconfig
        make -s -C $(pwd) O=$(pwd)/out KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j$(nproc)

        cp out/arch/arm64/boot/Image $(pwd)/arch/arm64/boot/Image
        EOF
        
        chmod +x build_kernel.sh

    - name: Run Build Script
      run: |
        ./build_kernel.sh

    - name: Upload Kernel Image Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Image-a23
        path: arch/arm64/boot/Image
